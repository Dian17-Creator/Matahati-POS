<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" height="100%">
            <defs>
              <!-- Gradasi Lipatan Atas Kantong Kiri -->
              <linearGradient id="leftBagLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#D99A4E"/>
                <stop offset="100%" stop-color="#E6AC66"/>
              </linearGradient>
              <!-- Gradasi Lipatan Atas Kantong Kanan -->
              <linearGradient id="rightBagLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#DDA668"/>
                <stop offset="100%" stop-color="#F0C797"/>
              </linearGradient>
              <!-- Gradasi Lipatan Atas Kantong Tengah -->
              <linearGradient id="centerBagLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#DA9C56"/>
                <stop offset="100%" stop-color="#ECC394"/>
              </linearGradient>
              <!-- Filter Outline Putih Tebal untuk Stiker Utama Kantong Tengah -->
              <filter id="stickerWhiteOutline" x="-20%" y="-20%" width="140%" height="140%">
                <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="4.5"/>
                <feFlood flood-color="#FFFFFF" flood-opacity="1" result="WHITE_FLOOD"/>
                <feComposite in="WHITE_FLOOD" in2="DILATED" operator="in" result="OUTLINE"/>
                <feMerge>
                  <feMergeNode in="OUTLINE"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <!-- 1. LATAR BELAKANG KREM HANGAT -->
            <!-- ===================================================================== -->
            <!-- 2. KANTONG KIRI (BELAKANG KIRI)                                       -->
            <!-- ===================================================================== -->
            <g id="bag-left">
              <!-- Sisi Lipatan Samping Kanan (Krem Terang) -->
              <polygon points="205,53 212,115 212,250 187,268 190,126 205,64" fill="#F4D1A6"/>
              <!-- Bayangan Lipatan Dalam Samping Kanan -->
              <polygon points="205,64 202,112 190,126" fill="#E6BC89"/>
              <!-- Badan Utama Depan (Cokelat Kraft Sedang) -->
              <polygon points="84,65 205,53 190,126 187,268 63,242 68,118" fill="#E2A65F"/>
              <!-- Lipatan Atas (Lip) -->
              <polygon points="83,64 205,52 204,63 83,75" fill="url(#leftBagLipGrad)"/>
              <!-- Garis Bayangan Halus Bawah Lipatan Atas -->
              <polygon points="83,75 204,63 203,66 84,78" fill="#C9893E" opacity="0.45"/>
              <!-- Segel Stiker Merah Oranye / Coral dengan Tepi Bawah Bergelombang -->
              <path d="M 105,73 &#10;                       L 176,66 &#10;                       L 171,126 &#10;                       C 166,129 161,124 155,126 &#10;                       C 149,129 143,124 137,126 &#10;                       C 131,129 125,124 119,126 &#10;                       C 113,129 106,124 94,126 Z" fill="#F26149"/>
              <!-- Kotak Pembulatan Merah Tua di Tengah Stiker Kiri -->
              <g transform="translate(137, 96) rotate(-4) skewX(-5)">
                <rect x="-15" y="-14" width="30" height="28" rx="6" fill="#E3422B"/>
                <!-- Garis aksen pegangan kecil di atas kotak -->
                <rect x="-7" y="-10" width="14" height="2.2" rx="1.1" fill="#F26149"/>
                <!-- Ikon Garpu Putih (Kiri) -->
                <path d="M -7,-4 L -7,1 C -7,2.8 -5.8,4 -4.5,4 L -4.5,10 L -3,10 L -3,4 C -1.7,4 -0.5,2.8 -0.5,1 L -0.5,-4 L -1.8,-4 L -1.8,0.5 L -3.1,0.5 L -3.1,-4 L -4.4,-4 L -4.4,0.5 L -5.7,0.5 L -5.7,-4 Z" fill="#FFFFFF"/>
                <!-- Ikon Sendok Putih (Kanan) -->
                <ellipse cx="5.2" cy="-0.5" rx="4.2" ry="5.5" fill="#FFFFFF"/>
                <rect x="4.3" y="4.2" width="1.8" height="6" rx="0.9" fill="#FFFFFF"/>
              </g>
            </g>
            <!-- ===================================================================== -->
            <!-- 3. KANTONG KANAN (BELAKANG KANAN)                                     -->
            <!-- ===================================================================== -->
            <g id="bag-right">
              <!-- Sisi Lipatan Samping Kanan (Krem Sedikit Lebih Hangat) -->
              <polygon points="494,68 511,132 513,262 479,282 478,142" fill="#EBC08E"/>
              <!-- Bayangan Lipatan Dalam Samping Kanan -->
              <polygon points="494,77 497,125 478,142" fill="#DFB07A"/>
              <!-- Badan Utama Depan (Krem Terang) -->
              <polygon points="374,78 494,68 478,142 479,282 365,258 361,132" fill="#F3CEA3"/>
              <!-- Lipatan Atas (Lip) -->
              <polygon points="374,77 494,67 493,76 374,86" fill="url(#rightBagLipGrad)"/>
              <!-- Garis Bayangan Halus Bawah Lipatan Atas -->
              <polygon points="374,86 493,76 492,79 374,89" fill="#CE975A" opacity="0.4"/>
              <!-- Segel Stiker Hijau dengan Tepi Bawah Bergelombang -->
              <path d="M 402,84 &#10;                       L 469,78 &#10;                       L 457,139 &#10;                       C 448,141 441,137 433,139 &#10;                       C 425,141 418,137 410,139 &#10;                       C 402,141 395,137 386,139 Z" fill="#009E3D"/>
              <!-- Kotak Pembulatan Hijau Muda di Tengah Stiker Kanan -->
              <g transform="translate(427, 108) rotate(-3) skewX(-6)">
                <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#008934"/>
                <!-- Header hijau muda di bagian atas ikon -->
                <rect x="-11" y="-11" width="22" height="5" rx="2.5" fill="#46C973"/>
                <rect x="-4" y="-9.5" width="8" height="2" rx="1" fill="#FFFFFF" opacity="0.85"/>
                <!-- Ikon Sendok & Garpu Menyilang Putih -->
                <!-- Garpu miring ke kanan atas -->
                <g transform="rotate(42) translate(0, 1)">
                  <path d="M -2.2,-8 L -2.2,-3.5 C -2.2,-2 -1.2,-1.2 -0.7,-1.2 L -0.7,8 L 0.7,8 L 0.7,-1.2 C 1.2,-1.2 2.2,-2 2.2,-3.5 L 2.2,-8 L 1.3,-8 L 1.3,-4.2 L 0.4,-4.2 L 0.4,-8 L -0.4,-8 L -0.4,-4.2 L -1.3,-4.2 L -1.3,-8 Z" fill="#FFFFFF"/>
                </g>
                <!-- Sendok miring ke kiri atas -->
                <g transform="rotate(-42) translate(0, 1)">
                  <ellipse cx="0" cy="-5" rx="2.3" ry="3.4" fill="#FFFFFF"/>
                  <rect x="-0.7" y="-2" width="1.4" height="10" rx="0.7" fill="#FFFFFF"/>
                </g>
              </g>
            </g>
            <!-- ===================================================================== -->
            <!-- 4. KANTONG TENGAH (DEPAN UTAMA, PALING BESAR)                         -->
            <!-- ===================================================================== -->
            <g id="bag-center">
              <!-- Sisi Kiri Menyamping 3D (Krem Lembut) -->
              <polygon points="226,24 231,37 205,123 197,274 248,296 247,128" fill="#EBC294"/>
              <!-- Bayangan Lipatan Segitiga Atas Sisi Kiri -->
              <polygon points="231,37 215,92 247,128" fill="#DFB17E"/>
              <!-- Sisi Kanan Utama Menghadap Depan-Kanan (Krem Terang) -->
              <polygon points="226,24 353,39 374,116 379,264 248,296 247,128 231,37" fill="#F6D3AA"/>
              <!-- Lipatan Atas Horizontal (Lip) -->
              <polygon points="226,23 354,38 356,49 230,36" fill="url(#centerBagLipGrad)"/>
              <!-- Garis Bayangan Bawah Lipatan Atas -->
              <polygon points="230,36 356,49 357,52 231,39" fill="#C98A44" opacity="0.4"/>
              <!-- Segel Stiker Merah Terang dengan Tepi Bawah Bergelombang -->
              <path d="M 258,40 &#10;                       L 329,48 &#10;                       L 340,95 &#10;                       C 331,96 324,91 315,92 &#10;                       C 306,93 299,89 290,90 &#10;                       C 281,91 275,87 268,89 Z" fill="#E62328"/>
              <!-- Ikon Garpu & Sendok Putih di Tengah Stiker Merah -->
              <g transform="translate(301, 67) rotate(5) skewX(6)">
                <!-- Garpu Putih (Kiri) -->
                <path d="M -8.5,-8 L -8.5,-1.5 C -8.5,0.8 -6.8,2.2 -5.2,2.2 L -5.2,9 L -3.3,9 L -3.3,2.2 C -1.7,2.2 0,0.8 0,-1.5 L 0,-8 L -1.6,-8 L -1.6,-2.2 L -3.4,-2.2 L -3.4,-8 L -5.1,-8 L -5.1,-2.2 L -6.9,-2.2 L -6.9,-8 Z" fill="#FFFFFF"/>
                <!-- Sendok Putih (Kanan) -->
                <ellipse cx="6.2" cy="-2.2" rx="4.2" ry="5.8" fill="#FFFFFF"/>
                <rect x="5.2" y="3" width="2" height="6.2" rx="1" fill="#FFFFFF"/>
              </g>
              <!-- =================================================================== -->
              <!-- STIKER BESAR TENGAH-BAWAH (DENGAN OUTLINE PUTIH TEBAL)              -->
              <!-- =================================================================== -->
              <g filter="url(#stickerWhiteOutline)">
                <!-- A. Lingkaran Hijau dengan Teks Putih "Rp" -->
                <circle cx="310" cy="166" r="35" fill="#6BB832"/>
                <text x="307" y="175" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Rp</text>
                <!-- B. Botol Saus Merah di Sebelah Kanan -->
                <g id="sauce-bottle">
                  <!-- Leher / Tutup Atas Botol -->
                  <path d="M 341,163 &#10;                           C 341,159 351,159 351,163 &#10;                           L 351,170 &#10;                           L 341,170 Z" fill="#D62327"/>
                  <!-- Badan Botol Saus -->
                  <path d="M 337,170 &#10;                           L 355,170 &#10;                           C 362,174 365,182 365,193 &#10;                           L 365,233 &#10;                           C 365,235.5 363,237 360.5,237 &#10;                           L 331.5,237 &#10;                           C 329,237 327,235.5 327,233 &#10;                           L 327,193 &#10;                           C 327,182 330,174 337,170 Z" fill="#D62327"/>
                  <!-- Label Oval Merah Muda/Terang di Tengah Botol -->
                  <ellipse cx="348" cy="202" rx="9" ry="12.5" fill="#E5484C"/>
                </g>
                <!-- C. Burger / Hotdog di Bagian Depan Bawah -->
                <g id="burger-hotdog">
                  <!-- Roti Atas (Oranye Keemasan) -->
                  <path d="M 292,211 &#10;                           C 292,199 301,195 313,195 &#10;                           C 325,195 334,199 334,211 Z" fill="#F39B38"/>
                  <!-- Roti Bawah (Oranye Keemasan) -->
                  <path d="M 292,226 &#10;                           L 334,226 &#10;                           C 334,233 328,236 313,236 &#10;                           C 298,236 292,233 292,226 Z" fill="#F39B38"/>
                  <!-- Sosis / Patty Panjang di Tengah (Merah Tua Kecokelatan) -->
                  <rect x="284" y="211.5" width="58" height="14" rx="7" fill="#B8292D"/>
                </g>
              </g>
            </g>
          </svg>